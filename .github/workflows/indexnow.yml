name: IndexNow notification

on:
  push:
    branches:
      - main

jobs:
  notify-indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for GitHub Pages deployment
        run: sleep 60

      - name: Notify IndexNow
        run: |
          curl --fail --show-error --silent \
            "https://api.indexnow.org/indexnow?url=https%3A%2F%2Fdemin6632-del.github.io%2Fchronicles-of-the-abyss-site%2F&key=12defb984787ad6d16157004530dd58c"
