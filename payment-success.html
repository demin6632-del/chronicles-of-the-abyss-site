<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Оплата DLC — Хроники Бездны</title><style>body{margin:0;background:#080510;color:#f3efff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:20px}.wrap{max-width:650px;margin:auto}.card{background:#12101c;border:1px solid #3d2b58;border-radius:20px;padding:22px;margin-top:35px}.code{font-size:18px;font-weight:900;word-break:break-all;background:#0d0a15;border:1px solid #5a4574;border-radius:12px;padding:14px;margin:15px 0}.muted{color:#c8bfd5;line-height:1.6}.btn{display:block;text-align:center;text-decoration:none;border-radius:14px;padding:14px;background:#21172f;border:1px solid #5a4574;color:#fff;font-weight:800;margin-top:12px}</style></head><body><main class="wrap"><section class="card"><h1 id="title">Проверяем оплату…</h1><p id="text" class="muted">Пожалуйста, подождите.</p><div id="code" class="code" style="display:none"></div><a class="btn" href="dlc.html">Вернуться к DLC</a></section></main><script>(async()=>{const q=new URLSearchParams(location.search),id=q.get('payment_id');if(!id){title.textContent='Не найден платёж';text.textContent='Откройте страницу после возврата со страницы оплаты.';return}try{const r=await fetch('/api/after-payment?payment_id='+encodeURIComponent(id),{cache:'no-store'});const d=await r.json();if(d.paid&&d.code){title.textContent='Оплата подтверждена';text.textContent='Сохраните код и введите его в игре «Хроники Бездны» в разделе активации DLC.';code.style.display='block';code.textContent=d.code}else{title.textContent='Оплата ещё не подтверждена';text.textContent='Платёж имеет статус: '+(d.status||'неизвестно')+'. Обновите страницу через несколько секунд.'}}catch(e){title.textContent='Не удалось проверить оплату';text.textContent='Попробуйте обновить страницу позже.'}})()</script></body></html>
